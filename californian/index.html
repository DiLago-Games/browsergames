<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Californian</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255, 143, 78, 0.2), transparent 45%),
        linear-gradient(135deg, #10131d, #181d2f 60%, #24192e);
      color: #fff4e7;
    }

    main {
      width: min(92vw, 640px);
      padding: 32px;
      border: 1px solid rgba(255, 214, 170, 0.25);
      border-radius: 20px;
      background: rgba(14, 18, 30, 0.86);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      line-height: 1.6;
      color: #ffd9b5;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 999px;
      background: #ff8f4e;
      color: #181d2f;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>🌴 Californian</h1>
    <p>A Californian-themed action game with band references is now linked from the DiLago Games homepage.</p>
    <p>This lightweight page keeps the new homepage entry functional while the full game experience is iterated on.</p>
    <a href="../index.html">Back to games</a>
  </main>
</body>
</html>
