<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feliz Aniversário, Alda!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <h1>Feliz Aniversário, Alda!</h1>
    <canvas id="scene" width="960" height="540" aria-label="Geburtstags-Spielszene"></canvas>

    <div class="controls">
      <button id="start-btn" class="btn primary">Ständchen starten</button>
      <button id="alda-btn" class="btn secondary" hidden>Für Alda 🎉</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
